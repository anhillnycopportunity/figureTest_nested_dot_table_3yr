<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dot plot table</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #222;
    }
    table { border-collapse: collapse; }
    th, td {
      padding: 0 10px;
      height: var(--row-h, 30px);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    thead th {
      font-weight: 600;
      vertical-align: bottom;
      border-bottom: 1px solid #999;
      padding-bottom: 4px;
    }
    th.chart, td.chart { padding: 0; }
    thead th.chart     { padding-bottom: 4px; }  /* same baseline as other header text */
    .legend       { display: flex; justify-content: center; gap: 16px; font-weight: 600; }
    .legend .dot  { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
                    margin-right: 5px; vertical-align: -1px; }
    td.chart div { display: block; }
    tr.group td   { text-align: left; font-weight: 700; border-bottom: 1px solid #ddd; }
    td.cat, th.label { text-align: left; padding-left: 20px; }
    tfoot td      { vertical-align: top; padding-top: 0; }
    tr.spacer td  { height: var(--spacer-h, 14px); }
    #title        { font-size: 18px; font-weight: 700; margin: 4px 0 12px; }
    #title:empty  { display: none; }
    #footnote     { font-size: 12px; color: #666; margin-top: 8px; }
    #capture      { display: inline-block; background: #fff; padding: 8px; }
    #downloads    { margin: 8px; display: flex; gap: 8px; }
    .btn {
      font: inherit; font-size: 13px; color: #222; text-decoration: none;
      background: #f4f4f4; border: 1px solid #ccc; border-radius: 4px;
      padding: 5px 10px; cursor: pointer;
    }
    .btn:hover    { background: #e8e8e8; }
  </style>
</head>
<body>
  <!-- Everything inside #capture goes into the PNG -->
  <div id="capture">
    <h1 id="title"></h1>
    <table id="dot-table"></table>
    <div id="footnote"></div>
  </div>
  <div id="downloads">
    <a id="dl-csv" class="btn" href="#">Download data (CSV)</a>
    <button id="dl-png" class="btn" type="button">Download image (PNG)</button>
  </div>
  <script src="table.js"></script>
</body>
</html>
